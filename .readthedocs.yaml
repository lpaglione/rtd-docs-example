# Read the Docs build recipe. RTD looks for this file at the ROOT of the repo.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py   # the Sphinx settings file below
  fail_on_warning: false        # set true later to make doc problems break the build

python:
  install:
    - requirements: docs/requirements.txt
